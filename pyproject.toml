    "uvicorn==0.40.0",
    "python-multipart==0.0.21",
    "joblib==1.5.2",
    "scikit-learn==1.7.2",
    "scipy==1.16.3",
    "numpy==2.3.4",
    "pandas==2.3.3",
    "sentence-transformers==5.1.2",
    "transformers==4.57.3",
    "torch==2.9.1",
    "tokenizers==0.22.1",
    "sentencepiece==0.2.1",
    "openai-whisper==20250625",
    "langdetect==1.0.9",
    "pyttsx3==2.99",
    "pydub==0.25.1",
    "soundfile==0.13.1",
    "xgboost==3.1.1",
    "imbalanced-learn==0.14.0",
    "httpx==0.28.1",
    "pydantic==2.12.5",
